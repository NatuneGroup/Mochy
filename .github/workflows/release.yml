name: Stable release

# Same model as Natune: every push to main publishes the next stable version, numbered from the
# release tags by .github/scripts/next-version.py, so appVersion is never bumped by hand. Nightlies
# come from dev (nightly.yml); the in-app "Nightly builds" switch picks between the two.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mochy-stable-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select stable release version
    if: github.repository == 'NatuneGroup/Mochy' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(sed -n 's/^appVersion=//p' gradle.properties)"
          base="${base%%+*}"
          version="$(python3 .github/scripts/next-version.py "$base")"
          tag="v$version"
          {
            echo "version=$version"
            echo "tag_name=$tag"
          } >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null ||
             gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag or release $tag already exists; skipping this stable release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: read
    with:
      variant: release
      app-version: ${{ needs.prepare.outputs.version }}
      upload-artifact: true
      artifact-name: stable-android
      require-signing: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

  linux:
    name: Linux x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/reusable-desktop-native.yml
    permissions:
      contents: read
    with:
      platform: linux-x64
      app-version: ${{ needs.prepare.outputs.version }}
    secrets:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/reusable-desktop-native.yml
    permissions:
      contents: read
    with:
      platform: windows-x64
      app-version: ${{ needs.prepare.outputs.version }}
    secrets:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

  publish:
    name: Publish stable release
    needs: [prepare, android, linux, windows]
    runs-on: blacksmith-2vcpu-ubuntu-2604
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download signed Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stable-android
          path: artifacts/android

      - name: Download native Linux x64 AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-native-linux-x64
          path: artifacts/linux

      - name: Download native Windows x64 portable ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-native-windows-x64
          path: artifacts/windows

      - name: Prepare release assets and notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(artifacts/android/*.apk)
          appimages=(artifacts/linux/*.AppImage)
          zips=(artifacts/windows/*.zip)
          [[ ${#apks[@]} -eq 1 && ${#appimages[@]} -eq 1 && ${#zips[@]} -eq 1 ]] || {
            echo "Expected one signed APK, one native AppImage and one native portable ZIP" >&2
            exit 1
          }
          mkdir release-assets
          # Mochy.apk is the name the Android updater prefers; desktop matches the -linux-x64.AppImage and -windows.zip suffixes.
          cp "${apks[0]}" release-assets/Mochy.apk
          cp "${appimages[0]}" "release-assets/Mochy-Desktop-${VERSION}-linux-x64.AppImage"
          cp "${zips[0]}" "release-assets/Mochy-Desktop-${VERSION}-windows.zip"
          for file in release-assets/*; do
            test -s "$file" || { echo "Empty release asset: $file" >&2; exit 1; }
          done
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          previous="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          {
            printf 'Mochy %s, built from [%s](https://github.com/%s/commit/%s).\n\n' \
              "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '## Changes\n\n'
            if [[ -n "$previous" ]]; then
              git log --first-parent --no-merges --format='* %s (%h)' "$previous..$GITHUB_SHA" | head -n 80
            else
              git log --first-parent --no-merges --format='* %s (%h)' -n 80 "$GITHUB_SHA"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Draft first, so the updater never sees a release with missing assets.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mochy $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
